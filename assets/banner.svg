    <circle cx="134" cy="112" r="4" fill="#ef4444"/>
    <line x1="156" y1="134" x2="174" y2="152" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="292" y="136" fill="#f1f5f9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="68" font-weight="800" letter-spacing="8">ZARF</text>
  <rect x="572" y="96" width="152" height="28" rx="14" fill="#0f291e" stroke="#22c55e" stroke-width="1.2"/>
  <circle cx="590" cy="110" r="4" fill="#22c55e"/>
  <text x="602" y="115" fill="#4ade80" font-family="ui-monospace, monospace" font-size="12" font-weight="700">100% OFFLINE</text>

